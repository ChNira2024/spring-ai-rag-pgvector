version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector-postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sisu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: